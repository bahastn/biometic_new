<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Device Management - ZKTeco Attendance System</title>
</head>
<body>
    <section>
        <div class="row mb-3">
            <div class="col-12">
                <a th:href="@{/devices/new}" class="btn btn-primary btn-custom">
                    <i class="bi bi-plus-circle"></i> Add New Device
                </a>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-hdd-network"></i> All Devices
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(devices)}" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p class="mt-2">No devices configured yet</p>
                            <a th:href="@{/devices/new}" class="btn btn-primary btn-custom">
                                <i class="bi bi-plus-circle"></i> Add Your First Device
                            </a>
                        </div>
                        <div th:unless="${#lists.isEmpty(devices)}" class="table-responsive">
                            <table class="table table-hover table-custom">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Device Name</th>
                                        <th>IP Address</th>
                                        <th>Port</th>
                                        <th>Location</th>
                                        <th>Status</th>
                                        <th>Connection</th>
                                        <th>Last Sync</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="device, iterStat : ${devices}">
                                        <td th:text="${iterStat.count}">1</td>
                                        <td th:text="${device.deviceName}">Device 1</td>
                                        <td th:text="${device.ipAddress}">192.168.1.127</td>
                                        <td th:text="${device.port}">4370</td>
                                        <td th:text="${device.location ?: 'N/A'}">Main Entrance</td>
                                        <td>
                                            <span th:if="${device.active}" class="badge bg-success badge-custom">Active</span>
                                            <span th:unless="${device.active}" class="badge bg-secondary badge-custom">Inactive</span>
                                        </td>
                                        <td>
                                            <span th:if="${device.connected}" class="badge bg-success badge-custom">
                                                <i class="bi bi-wifi"></i> Connected
                                            </span>
                                            <span th:unless="${device.connected}" class="badge bg-danger badge-custom">
                                                <i class="bi bi-wifi-off"></i> Disconnected
                                            </span>
                                        </td>
                                        <td th:text="${device.lastSyncTime != null ? #temporals.format(device.lastSyncTime, 'yyyy-MM-dd HH:mm') : 'Never'}">Never</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:if="${!device.connected}" 
                                                   th:href="@{/devices/connect/{id}(id=${device.id})}" 
                                                   class="btn btn-success" title="Connect">
                                                    <i class="bi bi-plug"></i>
                                                </a>
                                                <a th:if="${device.connected}" 
                                                   th:href="@{/devices/disconnect/{id}(id=${device.id})}" 
                                                   class="btn btn-warning" title="Disconnect">
                                                    <i class="bi bi-plug-fill"></i>
                                                </a>
                                                <a th:href="@{/devices/edit/{id}(id=${device.id})}" 
                                                   class="btn btn-primary" title="Edit">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{/devices/delete/{id}(id=${device.id})}" 
                                                   class="btn btn-danger" 
                                                   onclick="return confirm('Are you sure you want to delete this device?')" 
                                                   title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
