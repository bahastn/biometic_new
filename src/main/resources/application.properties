spring.application.name=bio_new

###################### Server Configuration ######################
# Server address and port can be overridden with environment variables:
# SERVER_ADDRESS and SERVER_PORT
server.address=${SERVER_ADDRESS:192.168.1.109}
server.port=${SERVER_PORT:8081}

###################### Postgres database ######################
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simcaf}
#spring.datasource.url=jdbc:postgresql://3.67.135.35:5432/scms
#spring.datasource.url=jdbc:postgresql://3.76.28.3:5432/scms
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:simcaf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:simcaf@2025}

###################### JPA/Hibernate Configuration ######################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

###################### Thymeleaf Configuration ######################
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

###################### ZKTeco Device Configuration ######################
# Default device settings can be overridden with environment variables
zkteco.default.device.ip=${ZKTECO_DEFAULT_DEVICE_IP:192.168.1.127}
zkteco.default.device.port=${ZKTECO_DEFAULT_DEVICE_PORT:4370}
zkteco.sync.enabled=${ZKTECO_SYNC_ENABLED:true}
zkteco.sync.interval=${ZKTECO_SYNC_INTERVAL:60000}

###################### ZKTeco Push Mode Server Configuration ######################
# Server socket for receiving pushed data from devices (cloud/push mode)
# Enable this if your device is configured to push data to a server
zkteco.server.enabled=${ZKTECO_SERVER_ENABLED:true}
zkteco.server.port=${ZKTECO_SERVER_PORT:8086}

